name: CI

on:
    push:
        paths-ignore:
            - 'LICENSE-*'
            - '**/*.md'
            - '.gitignore'
            - 'CHANGELOG.md'
        branches:
            - master
    pull_request:
    workflow_dispatch:

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: dtolnay/rust-toolchain@v1
                with:
                    profile: minimal
                    toolchain: stable
                    override: true
            -   run: cargo test --all-features --tests
    docs:
        name: Docs
        runs-on: ubuntu-latest
        env:
            RUSTDOCFLAGS: -Dwarnings
        steps:
            -   uses: actions/checkout@v4
            -   uses: dtolnay/rust-toolchain@v1
                with:
                    profile: minimal
                    toolchain: stable
                    override: true
            -   run: cargo doc --all-features --no-deps
            -   run: cargo test --all-features --doc
    clippy:
        name: Clippy
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: dtolnay/rust-toolchain@v1
                with:
                    profile: minimal
                    toolchain: nightly
                    override: true
            -   run: rustup component add clippy
            -   run: cargo --locked clippy --workspace --tests --examples --all-features -- -D warnings
    style:
        name: Style
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: dtolnay/rust-toolchain@v1
                with:
                    profile: minimal
                    toolchain: nightly
                    override: true
            -   run: rustup component add rustfmt
            -   run: cargo fmt -- --check
    no_std:
        name: Verify no_std
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4
            -   uses: dtolnay/rust-toolchain@v1
                with:
                    profile: minimal
                    toolchain: stable
                    override: true
            -   run: cargo build -p mtp_spec --no-default-features
